<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Mehdi Zitouni</title>
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --ink:#0a0716; --ink-2:#140a2c; --ink-3:#1f1142;
    --paper:#f6f0e4; --muted:rgba(246,240,228,.62);
    --orange:#ff5a1f; --plum:#c86bfe; --cyan:#61dfe8;
    --line:rgba(246,240,228,.14); --line-2:rgba(246,240,228,.28);
    --r:16px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--paper);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* ── Login ── */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .login-box{background:var(--ink-2);border:1px solid var(--line-2);border-radius:24px;padding:40px;width:100%;max-width:380px;text-align:center}
  .login-logo{font-size:32px;margin-bottom:12px}
  .login-box h1{font-size:22px;font-weight:600;margin-bottom:6px}
  .login-box p{color:var(--muted);font-size:14px;margin-bottom:28px}
  .login-box input{width:100%;background:var(--ink-3);border:1px solid var(--line-2);border-radius:12px;padding:12px 16px;color:var(--paper);font-size:15px;outline:none;transition:.2s;letter-spacing:.06em}
  .login-box input:focus{border-color:var(--plum)}
  .login-box button{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--plum),var(--orange));color:var(--paper);border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .login-box button:hover{opacity:.88;transform:translateY(-1px)}
  .login-error{color:var(--orange);font-size:13px;margin-top:10px;display:none}

  /* ── Shell ── */
  #app{display:none}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(10,7,22,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .topbar-title{font-weight:700;font-size:17px}
  .topbar-sub{color:var(--muted);font-size:13px}
  .period-btns{display:flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
  .period-btns button{padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;transition:.15s}
  .period-btns button.on{background:var(--paper);color:var(--ink)}
  .topbar-right{display:flex;align-items:center;gap:12px}
  .refresh-btn{background:none;border:1px solid var(--line-2);border-radius:999px;color:var(--muted);font-size:12px;padding:6px 14px;cursor:pointer;transition:.15s}
  .refresh-btn:hover{border-color:var(--paper);color:var(--paper)}
  .logout-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;transition:.15s;padding:6px}
  .logout-btn:hover{color:var(--paper)}

  /* ── Main ── */
  .main{padding:28px 24px;max-width:1400px;margin:0 auto}

  /* ── KPIs ── */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
  .kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
  .kpi-val{font-size:32px;font-weight:700;line-height:1}
  .kpi-sub{font-size:12px;color:var(--muted);margin-top:6px}
  .kpi--plum .kpi-val{color:var(--plum)}
  .kpi--orange .kpi-val{color:var(--orange)}
  .kpi--cyan .kpi-val{color:var(--cyan)}
  .kpi--paper .kpi-val{color:var(--paper)}

  /* ── Charts grid ── */
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .charts-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
  @media(max-width:900px){.charts-row,.charts-row-3{grid-template-columns:1fr}}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:22px}
  .card-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:18px}
  .chart-wrap{position:relative;height:200px}

  /* ── Conversations ── */
  .section-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .section-title span{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
  .conv-list{display:flex;flex-direction:column;gap:8px}
  .conv-item{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .conv-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;transition:background .15s;user-select:none}
  .conv-header:hover{background:var(--ink-3)}
  .conv-meta{flex:1;min-width:0}
  .conv-date{font-size:13px;font-weight:600}
  .conv-stats{font-size:12px;color:var(--muted);margin-top:2px}
  .conv-badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
  .conv-badge--fr{border-color:rgba(200,107,254,.4);color:var(--plum)}
  .conv-badge--en{border-color:rgba(97,223,232,.4);color:var(--cyan)}
  .conv-badge--booking{border-color:rgba(255,90,31,.4);color:var(--orange);margin-left:6px}
  .conv-toggle{color:var(--muted);font-size:18px;transition:transform .2s;flex-shrink:0}
  .conv-item.open .conv-toggle{transform:rotate(90deg)}
  .conv-body{display:none;padding:0 18px 16px;border-top:1px solid var(--line)}
  .conv-item.open .conv-body{display:block}
  .msg-thread{display:flex;flex-direction:column;gap:10px;padding-top:14px}
  .msg{padding:10px 14px;border-radius:12px;font-size:13px;max-width:88%;line-height:1.5}
  .msg--user{background:linear-gradient(135deg,var(--plum),var(--orange));color:var(--paper);align-self:flex-end;border-radius:12px 12px 2px 12px}
  .msg--bot{background:var(--ink-3);color:var(--paper);align-self:flex-start;border-radius:12px 12px 12px 2px}
  .msg-ts{font-size:10px;opacity:.5;margin-top:3px;text-align:right}

  /* ── Loading / Empty ── */
  .loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:14px;flex-direction:column;gap:12px}
  .spinner{width:28px;height:28px;border:3px solid var(--line-2);border-top-color:var(--plum);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <h1>Portfolio Analytics</h1>
    <p>Entrez votre clé d'accès pour consulter le tableau de bord.</p>
    <input id="key-input" type="password" placeholder="Clé analytics…" autocomplete="off" />
    <button id="key-submit">Accéder →</button>
    <div class="login-error" id="login-error">Clé incorrecte.</div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">📊 Analytics</span>
      <span class="topbar-sub" id="tb-sub">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="period-btns">
        <button class="on" data-days="7">7 j</button>
        <button data-days="30">30 j</button>
        <button data-days="90">90 j</button>
      </div>
      <button class="refresh-btn" id="refresh-btn">↻ Rafraîchir</button>
      <button class="logout-btn" id="logout-btn">Déconnexion</button>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="loading"><div class="spinner"></div>Chargement…</div>
  </main>
</div>

<script>
const WORKER = 'https://portfolio-chatbot.mehdiui94.workers.dev';
let currentKey = '';
let currentDays = 7;
let charts = {};

// ── Auth ──────────────────────────────────────────────────────────────────────
const stored = sessionStorage.getItem('mz-analytics-key');
if (stored) unlockWith(stored);

document.getElementById('key-submit').addEventListener('click', () => {
  unlockWith(document.getElementById('key-input').value.trim());
});
document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlockWith(document.getElementById('key-input').value.trim());
});

async function unlockWith(key) {
  if (!key) return;
  const res = await fetch(`${WORKER}/analytics?key=${encodeURIComponent(key)}&days=7`);
  if (res.status === 401) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  currentKey = key;
  sessionStorage.setItem('mz-analytics-key', key);
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const data = await res.json();
  render(data, 7);
}

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('mz-analytics-key');
  location.reload();
});

// ── Period buttons ────────────────────────────────────────────────────────────
document.querySelectorAll('.period-btns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btns button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    currentDays = parseInt(btn.dataset.days);
    loadData(currentDays);
  });
});

document.getElementById('refresh-btn').addEventListener('click', () => loadData(currentDays));

async function loadData(days) {
  document.getElementById('main-content').innerHTML = '<div class="loading"><div class="spinner"></div>Chargement…</div>';
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  const res = await fetch(`${WORKER}/analytics?key=${encodeURIComponent(currentKey)}&days=${days}`);
  const data = await res.json();
  render(data, days);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(data, days) {
  const s = data.summary || {};
  document.getElementById('tb-sub').textContent =
    `${days === 7 ? '7 derniers jours' : days === 30 ? '30 derniers jours' : '90 derniers jours'} · dernière maj ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;

  // Fill date range with zeros
  const msgMap = Object.fromEntries((data.messages_per_day || []).map(r => [r.date, r.count]));
  const pvMap  = Object.fromEntries((data.pageviews_per_day || []).map(r => [r.date, r.count]));
  const labels = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    labels.push(d.toISOString().slice(0, 10));
  }
  const msgData = labels.map(d => msgMap[d] || 0);
  const pvData  = labels.map(d => pvMap[d]  || 0);
  const shortLabels = labels.map(d => { const [,m,dd] = d.split('-'); return `${parseInt(dd)}/${parseInt(m)}`; });

  const total_sessions = s.total_sessions ?? 0;
  const bookings       = s.bookings ?? 0;
  const lang_fr        = s.lang_fr ?? 0;
  const lang_en        = s.lang_en ?? 0;
  const page_views     = s.page_views ?? 0;
  const total_messages = s.total_messages ?? 0;
  const bookingRate    = total_sessions > 0 ? Math.round((bookings / total_sessions) * 100) : 0;

  document.getElementById('main-content').innerHTML = `
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi kpi--plum">
        <div class="kpi-label">Conversations</div>
        <div class="kpi-val">${total_sessions}</div>
        <div class="kpi-sub">${total_messages} messages échangés</div>
      </div>
      <div class="kpi kpi--orange">
        <div class="kpi-label">Réservations</div>
        <div class="kpi-val">${bookings}</div>
        <div class="kpi-sub">Taux de conversion : ${bookingRate}%</div>
      </div>
      <div class="kpi kpi--cyan">
        <div class="kpi-label">Page views</div>
        <div class="kpi-val">${page_views}</div>
        <div class="kpi-sub">Visites tracker</div>
      </div>
      <div class="kpi kpi--paper">
        <div class="kpi-label">Langues</div>
        <div class="kpi-val">${lang_fr > lang_en ? 'FR' : 'EN'}</div>
        <div class="kpi-sub">FR ${lang_fr} · EN ${lang_en}</div>
      </div>
    </div>

    <!-- Charts row 1 -->
    <div class="charts-row">
      <div class="card">
        <div class="card-title">Messages chatbot / jour</div>
        <div class="chart-wrap"><canvas id="chart-msgs"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Page views / jour</div>
        <div class="chart-wrap"><canvas id="chart-pvs"></canvas></div>
      </div>
    </div>

    <!-- Charts row 2 -->
    <div class="charts-row" style="margin-bottom:28px">
      <div class="card">
        <div class="card-title">Langue des conversations</div>
        <div class="chart-wrap" style="height:180px"><canvas id="chart-lang"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Pages les plus visitées</div>
        <div class="chart-wrap"><canvas id="chart-pages"></canvas></div>
      </div>
    </div>

    <!-- Conversations -->
    <div class="section-title">Conversations <span id="conv-count"></span></div>
    <div class="conv-list" id="conv-list"></div>
  `;

  // Chart defaults
  Chart.defaults.color = 'rgba(246,240,228,.5)';
  Chart.defaults.borderColor = 'rgba(246,240,228,.08)';
  Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

  const chartOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f1142', titleColor: '#f6f0e4', bodyColor: 'rgba(246,240,228,.7)', borderColor: 'rgba(246,240,228,.15)', borderWidth: 1 } }, scales: { x: { grid: { color: 'rgba(246,240,228,.06)' }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: 'rgba(246,240,228,.06)' }, beginAtZero: true, ticks: { precision: 0 } } } };

  charts.msgs = new Chart(document.getElementById('chart-msgs'), {
    type: 'line',
    data: { labels: shortLabels, datasets: [{ data: msgData, borderColor: '#c86bfe', backgroundColor: 'rgba(200,107,254,.12)', fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5 }] },
    options: chartOpts,
  });

  charts.pvs = new Chart(document.getElementById('chart-pvs'), {
    type: 'bar',
    data: { labels: shortLabels, datasets: [{ data: pvData, backgroundColor: 'rgba(97,223,232,.25)', borderColor: '#61dfe8', borderWidth: 1.5, borderRadius: 4 }] },
    options: chartOpts,
  });

  charts.lang = new Chart(document.getElementById('chart-lang'), {
    type: 'doughnut',
    data: {
      labels: ['Français', 'English'],
      datasets: [{ data: [lang_fr, lang_en], backgroundColor: ['rgba(200,107,254,.7)', 'rgba(97,223,232,.7)'], borderColor: ['#c86bfe', '#61dfe8'], borderWidth: 2 }],
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom', labels: { color: 'rgba(246,240,228,.7)', padding: 12, boxWidth: 12 } }, tooltip: { backgroundColor: '#1f1142', titleColor: '#f6f0e4', bodyColor: 'rgba(246,240,228,.7)' } }, cutout: '65%' },
  });

  const topPages = (data.top_pages || []).slice(0, 6);
  charts.pages = new Chart(document.getElementById('chart-pages'), {
    type: 'bar',
    data: {
      labels: topPages.map(p => p.page || '/'),
      datasets: [{ data: topPages.map(p => p.count), backgroundColor: 'rgba(255,90,31,.25)', borderColor: '#ff5a1f', borderWidth: 1.5, borderRadius: 4 }],
    },
    options: { ...chartOpts, indexAxis: 'y', scales: { x: { ...chartOpts.scales.x, ticks: { precision: 0 } }, y: { ...chartOpts.scales.y, grid: { display: false } } } },
  });

  // Conversations
  renderConversations(data.sessions || []);
}

function renderConversations(sessions) {
  const list = document.getElementById('conv-list');
  const countEl = document.getElementById('conv-count');
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">Aucune conversation sur cette période.</div>';
    countEl.textContent = '';
    return;
  }
  countEl.textContent = `${sessions.length} session${sessions.length > 1 ? 's' : ''}`;

  list.innerHTML = sessions.map((s, i) => {
    const dt = new Date(s.started_at);
    const dateStr = dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const msgs = s.messages || [];
    const langClass = s.lang === 'en' ? 'conv-badge--en' : 'conv-badge--fr';
    const langLabel = s.lang === 'en' ? 'EN' : 'FR';
    const bookingBadge = s.booking_confirmed ? '<span class="conv-badge conv-badge--booking">📅 Réservation</span>' : '';
    const preview = msgs[0]?.user?.slice(0, 60) || '—';

    const thread = msgs.map(m => `
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        <div class="msg msg--user">${escHtml(m.user)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start">
        <div class="msg msg--bot">${escHtml(m.bot)}</div>
        <div class="msg-ts">${new Date(m.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    `).join('');

    return `
      <div class="conv-item" id="conv-${i}">
        <div class="conv-header" onclick="toggleConv(${i})">
          <div class="conv-meta">
            <div class="conv-date">${dateStr}</div>
            <div class="conv-stats">${msgs.length} message${msgs.length > 1 ? 's' : ''} · "${escHtml(preview)}${preview.length >= 60 ? '…' : ''}"</div>
          </div>
          <span class="conv-badge ${langClass}">${langLabel}</span>
          ${bookingBadge}
          <span class="conv-toggle">›</span>
        </div>
        <div class="conv-body">
          <div class="msg-thread">${thread}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleConv(i) {
  const el = document.getElementById(`conv-${i}`);
  el.classList.toggle('open');
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
